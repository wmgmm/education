<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Responsible AI Adventures of Cardiff University</title>
<style>
  /* Retro green-screen terminal. One file, no dependencies, no build.
     Visual system inherited from Demand_First_Adventure.html; the
     high-contrast mode swaps the whole palette. */
  :root {
    --bg: #001100;
    --fg: #00FF66;
    --warn: #FFFF00;
    --fail: #FF6666;
    --ok: #66FF66;
    --dim: #00aa44;
    --glow: 0 0 6px rgba(0, 255, 102, 0.55);
    --font: "Courier New", Courier, "Lucida Console", monospace;
    --size: 16px;
  }
  body.hc {
    --bg: #000000;
    --fg: #ffffff;
    --warn: #ffd400;
    --fail: #ff8080;
    --ok: #a0ffa0;
    --dim: #d0d0d0;
    --glow: none;
  }
  body.lg { --size: 21px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: var(--size);
    line-height: 1.45;
    text-shadow: var(--glow);
    min-height: 100vh;
    min-height: 100svh;
  }
  /* Scan lines and a soft vignette. Purely decorative, gone in high contrast. */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
  }
  body.hc::before, body.hc::after { display: none; }

  .skip {
    position: absolute; left: -999px; top: 0; background: var(--fg); color: var(--bg);
    padding: 0.4rem 0.8rem; z-index: 20; text-shadow: none;
  }
  .skip:focus { left: 0.5rem; top: 0.5rem; }

  .wrap { max-width: 82ch; margin: 0 auto; padding: 0.75rem 1rem 1rem; position: relative; z-index: 6; }

  header { border-bottom: 1px solid var(--dim); padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
  .brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; justify-content: space-between; }
  .brand .sub { margin: 0; color: var(--dim); font-size: 0.85em; font-weight: normal; }
  .toggles { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }

  button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--dim); padding: 0.35em 0.7em; cursor: pointer;
    text-shadow: inherit; text-align: left; min-height: 2.4em;
  }
  button:hover { background: rgba(0,255,102,0.12); }
  body.hc button:hover { background: rgba(255,255,255,0.15); }
  button:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  button[disabled] { opacity: 0.55; cursor: default; }
  .toggles button { font-size: 0.8em; min-height: 2em; padding: 0.2em 0.6em; }
  .settings { font-size: 0.75em; min-height: 1.8em; padding: 0.15em 0.55em; color: var(--dim); border-color: var(--dim); }
  .settings[aria-expanded="true"] { color: var(--fg); }
  .toggles[hidden] { display: none; }
  .toggles .hint { flex-basis: 100%; color: var(--dim); font-size: 0.75em; }

  #term { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 12em; outline: none; }
  #term .l { display: block; min-height: 1.45em; }
  #term .warn { color: var(--warn); }
  #term .fail { color: var(--fail); }
  #term .ok { color: var(--ok); }
  #term .dim { color: var(--dim); }
  #term .box { color: var(--warn); }
  #term .dir { color: var(--dim); font-style: italic; }
  #term .mf { color: var(--warn); }
  #term .you { font-weight: bold; }
  #term .anim { min-height: 1.45em; }
  #term .prompt { margin-top: 0.4em; }
  .cursor::after { content: "\2588"; animation: blink 1s steps(1) infinite; }
  body.nomo .cursor::after { animation: none; }
  @keyframes blink { 50% { opacity: 0; } }

  #choices { display: grid; gap: 0.4rem; margin: 0.8rem 0 0; }
  #choices button { width: 100%; min-height: 2.4em; }
  @media (pointer: coarse) { #choices button { min-height: 2.75em; } }
  #choices button .k { color: var(--warn); margin-right: 0.6em; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 480px) {
    .wrap { padding: 0.5rem 0.6rem 2.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor::after { animation: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#term">Skip to the terminal</a>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 class="sub">The Responsible AI Adventures of Cardiff University</h1>
      <button type="button" id="btn-settings" class="settings" aria-expanded="false" aria-controls="toggles">SETTINGS</button>
    </div>
    <div class="toggles" id="toggles" aria-label="Display settings" hidden>
      <button type="button" id="tgl-text" aria-pressed="false">TEXT: NORMAL</button>
      <button type="button" id="tgl-hc" aria-pressed="false">CONTRAST: NORMAL</button>
      <button type="button" id="tgl-motion" aria-pressed="true">MOTION: ON</button>
      <button type="button" id="btn-restart">RESTART</button>
      <span class="hint">Keys: A B C D or 1 2 3 4 to choose, ENTER to continue, any key skips the typing.</span>
    </div>
  </header>

  <main>
    <div id="term" role="log" aria-live="polite" tabindex="-1"></div>
    <div id="choices"></div>
  </main>

</div>

<script>
/* ------------------------------------------------------------------ story
   A node graph. Each node: banner, text, opts. `text` and `opts` may be a
   function of the flags F, so a scene can read what you did earlier. Each
   option: k (key), t (label), to (next node id, or "end"), set / add
   (flag effects), when (F => bool, hides the option), say (consequence
   lines, string[] or F => string[], resolved AFTER the flags are applied).
   Lines are strings or [string, cls]: "dir" is a stage direction, "you"
   a spoken line, "mf" the mainframe. Voice after Jumpin' Jack Flash (1986).
   Facts come from the workshop's own documents: the Copilot-revised Deep
   Research report and the site's Responsible AI lines. Lines are kept short in
   the source; flow() joins continuations on screen so text fills the column. */

const NODES = {
  start: {
    banner: "PAGE 1: THE LATE NIGHT OFFICE",
    text: [
      ["(11:45 PM. Cardiff. A lecturer alone with 180 unread", "dir"],
      ["essays and a mug that says WORLD'S OKAYEST ACADEMIC.", "dir"],
      ["The screen flashes green and starts beeping.)", "dir"],
      "",
      ["YOU: (slapping the monitor)", "you"],
      "Not tonight, you phosphor menace. I have marking.",
      "",
      ["> MAINFRAME: KNOCK KNOCK, LECTURER.", "mf"],
      ["> MAINFRAME: I AM THE UNIVERSITY MAINFRAME. THIS IS NOT A DRILL.", "mf"],
      ["> MAINFRAME: 95% OF YOUR STUDENTS USE AI. I HAVE SEEN THE LOGS.", "mf"],
      ["> MAINFRAME: THE MATTS LEFT ONE NOTE. THEN THEY LEFT.", "mf"],
      "",
      ["(The printer screeches into life. One line.)", "dir"],
      ["'THE HUMAN VALUE IS IN THE REVIEW.'", "warn"]
    ],
    opts: [{ k: "", t: "TURN THE PAGE", to: "handbook" }]
  },

  handbook: {
    banner: "WEEK 1: THE HANDBOOK",
    text: [
      ["(Ten to five. A colleague slides sixty warm pages", "dir"],
      ["across the desk. A chatbot wrote them on Tuesday.)", "dir"],
      "",
      ["COLLEAGUE: Just needs your signature by five. Ha ha.", "you"],
      "",
      ["> MAINFRAME: PAGE 14 PROMISES A FIELD TRIP.", "mf"],
      ["> MAINFRAME: TO AN INSTITUTE THAT DOES NOT EXIST.", "mf"],
      ["> MAINFRAME: I CHECKED. I CHECK EVERYTHING. IT IS MY THING.", "mf"]
    ],
    opts: [
      { k: "A", t: "Sign it. It is ten to five and I am only human.", to: "inbox", set: { readHandbook: false },
        say: [
          ["YOU: (signing with a flourish) There. Governance.", "you"],
          "",
          ["> MAINFRAME: SIGNED. THE INSTITUTE OF MARINE ETHICS", "mf"],
          ["> MAINFRAME: NOW EXISTS ON PAPER, WITH YOUR NAME UNDER IT.", "mf"],
          ["> MAINFRAME: FORTY STUDENTS WILL FIND IT IN WEEK 6.", "mf"],
          ["> MAINFRAME: WITH A MINIBUS.", "mf"]
        ] },
      { k: "B", t: "Read it first. Five can wait. Five is a construct.", to: "inbox", set: { readHandbook: true },
        say: [
          ["YOU: (forty minutes later, red pen raised)", "you"],
          "Page 14. The Cardiff Institute of Marine Ethics.",
          "",
          ["COLLEAGUE: Ah.", "you"],
          "",
          ["> MAINFRAME: DELETED. FORTY MINUTES TO READ.", "mf"],
          ["> MAINFRAME: FOUR SECONDS TO FIX. THAT IS THE RATIO.", "mf"]
        ] }
    ]
  },

  inbox: {
    banner: "WEEK 2: THE INBOX",
    text: F => [
      F.readHandbook
        ? ["(Forty minutes well spent. Then the inbox opens.)", "dir"]
        : ["(Your signature is still wet. The inbox opens.)", "dir"],
      "",
      ["> MAINFRAME: 41 EXTENSION REQUESTS. EACH WITH A MEDICAL NOTE.", "mf"],
      ["> MAINFRAME: EACH NEEDS A REPLY THAT SOUNDS LIKE YOU, IS KIND,", "mf"],
      ["> MAINFRAME: AND QUOTES THE REGULATIONS CORRECTLY.", "mf"],
      ["> MAINFRAME: IT IS 11 PM. YOUR TAKEAWAY ARRIVES IN 20 MINUTES.", "mf"],
      "",
      ["YOU: (staring) You know about the takeaway?", "you"],
      "",
      ["> MAINFRAME: I KNOW ABOUT THE TAKEAWAY.", "mf"]
    ],
    opts: [
      { k: "A", t: "Paste all 41 into the free chatbot app. Done by midnight.", to: "lecture", set: { tool: "public" },
        say: [
          ["YOU: (typing) Ninety seconds. Warm. Accurate. Genius.", "you"],
          "",
          ["> MAINFRAME: CONGRATULATIONS. 41 MEDICAL NOTES NOW LIVE", "mf"],
          ["> MAINFRAME: ON A SERVER IN A COUNTRY YOU WOULD HAVE TO LOOK UP.", "mf"],
          ["> MAINFRAME: THE TERMS LET THEM TRAIN ON WHAT YOU PASTE.", "mf"],
          ["> MAINFRAME: I WOULD HAVE MENTIONED IT. YOU DID NOT ASK.", "mf"]
        ] },
      { k: "B", t: "Sign in to Gemini with my CU account. The approved one.", to: "lecture", set: { tool: "approved" },
        say: [
          ["YOU: (typing) Ninety seconds. Warm. Accurate. Contract.", "you"],
          "",
          ["> MAINFRAME: THE NOTES STAY UNDER THE UNIVERSITY'S CONTRACT.", "mf"],
          ["> MAINFRAME: APPROVED FOR CONFIDENTIAL DATA. SAME REPLIES,", "mf"],
          ["> MAINFRAME: ELEVEN SECONDS LONGER: YOU READ THEM BEFORE SENDING.", "mf"],
          ["> MAINFRAME: NOBODY NOTICED. THAT IS THE POINT.", "mf"]
        ] },
      { k: "C", t: "Write all 41 myself. Like a person. A tired person.", to: "lecture", set: { tool: "hand" },
        say: [
          ["(1 AM. The takeaway is cold. Reply 38 begins", "dir"],
          ["'Dear' and the wrong name.)", "dir"],
          "",
          ["> MAINFRAME: HUMAN ERROR IS STILL ERROR, LECTURER.", "mf"],
          ["> MAINFRAME: IT IS JUST YOURS. AND YOU CAN FIND IT.", "mf"]
        ] }
    ]
  },

  lecture: {
    banner: "WEEK 3: THE LECTURE",
    text: F => [
      F.tool === "public" ? ["(Your 41 replies went out in ninety seconds. Word", "dir"]
        : F.tool === "approved" ? ["(Your 41 replies went out, checked, under contract.", "dir"]
        : ["(The wrongly named student has forgiven you. The", "dir"],
      F.tool === "public" ? ["has spread that you answer fast. A lecture hall.)", "dir"]
        : F.tool === "approved" ? ["Nobody noticed. A lecture hall. 180 faces.)", "dir"]
        : ["other forty have not replied. A lecture hall.)", "dir"],
      "",
      ["STUDENT: (into the microphone, so everyone hears)", "you"],
      "Are we allowed to use AI on this module?",
      "",
      ["> MAINFRAME: A 2026 NATIONAL SURVEY SAYS 95% OF THEM DO.", "mf"],
      ["> MAINFRAME: 180 PEOPLE ARE WAITING. SO IS THE MICROPHONE.", "mf"],
      ["> MAINFRAME: SAY SOMETHING, LECTURER. SAY ANYTHING.", "mf"]
    ],
    opts: [
      { k: "A", t: "'No. It is banned.' (Drops mic. Mic was on.)", to: "reading", set: { taught: false, banned: true },
        say: F => [
          ["(Two students clap. They never used it anyway.)", "dir"],
          "",
          ["> MAINFRAME: THE OTHER 178 KEEP USING IT, BUT NOW IN SECRET.", "mf"],
          ["> MAINFRAME: YOU CANNOT TEACH A THING NOBODY ADMITS TO USING.", "mf"],
          ...(F.tool !== "hand" ? [["> MAINFRAME: ALSO: THE TOOL YOU JUST BANNED WROTE YOUR", "mf"], ["> MAINFRAME: 41 REPLIES LAST WEEK. I SAY THIS AS A FRIEND.", "mf"]] : []),
          ["> MAINFRAME: THE BAN IS ENFORCED BY ONE MECHANISM: HOPE.", "mf"]
        ] },
      { k: "B", t: "'It is your degree. Use your judgement.' (Wise. Vague.)", to: "reading", set: { taught: false },
        say: [
          ["(They use their judgement. Their judgement is that", "dir"],
          ["the chatbot writes faster than they do.)", "dir"],
          "",
          ["> MAINFRAME: SPEED IS TRUE. WHETHER IT IS RIGHT", "mf"],
          ["> MAINFRAME: WAS THE QUESTION. NOBODY ASKED IT.", "mf"]
        ] },
      { k: "C", t: "Spend the hour making them fact-check a chatbot.", to: "reading", set: { taught: true },
        say: [
          ["YOU: (to the hall) Ask it for three sources. Go.", "you"],
          "",
          ["(It gives four. One is real. One is by an author", "dir"],
          ["who died eleven years before the paper.", "dir"],
          ["Twelve students spot this. Twelve students cheer.)", "dir"],
          "",
          ["> MAINFRAME: SPOTTING A FAKE SOURCE IS A SKILL.", "mf"],
          ["> MAINFRAME: THEY HAVE IT NOW. I SAW THEIR FACES.", "mf"]
        ] }
    ]
  },

  reading: {
    banner: "WEEK 5: THE READING LIST",
    text: F => [
      F.banned ? ["(Since the ban, nobody mentions AI to you. They", "dir"]
        : F.taught ? ["(Since the fact-check hour, three students have", "dir"]
        : ["(Since the lecture, the essays arrive faster.", "dir"],
      F.banned ? ["mention it to each other. Loudly. In corridors.)", "dir"]
        : F.taught ? ["emailed you fake sources they found. Unprompted.)", "dir"]
        : ["Nobody says how. Nobody asks.)", "dir"],
      "",
      ["YOU: (at midnight) I need a literature review on", "you"],
      "assessment redesign. By Monday. From nothing.",
      "",
      ["> MAINFRAME: DEEP RESEARCH READS 400 PAGES. NINE MINUTES.", "mf"],
      ["> MAINFRAME: A COLLEAGUE SUGGESTS RUNNING IT AGAIN 'WITH PLEASE'.", "mf"],
      ["> MAINFRAME: YOUR COLLEAGUE IS NOT A SCIENTIST.", "mf"]
    ],
    opts: [
      { k: "A", t: "Run it six more times with different wording. Options!", to: "marking", add: { runs: 7 },
        say: [
          ["(Seven reports. All good. All slightly different.)", "dir"],
          "",
          ["> MAINFRAME: 2,800 PAGES READ BY A MACHINE", "mf"],
          ["> MAINFRAME: SO THAT YOU COULD READ NONE OF THEM.", "mf"],
          ["> MAINFRAME: A CHAT REPLY COSTS ONE WEB SEARCH.", "mf"],
          ["> MAINFRAME: THIS COST A SMALL VILLAGE'S EVENING.", "mf"]
        ] },
      { k: "B", t: "Edit the research plan first, then run it once.", to: "marking", add: { runs: 1 },
        say: [
          ["YOU: (deleting two questions) You did not need those.", "you"],
          "",
          ["> MAINFRAME: ONE RUN. ONE REPORT. IT ANSWERS WHAT YOU", "mf"],
          ["> MAINFRAME: ASKED, BECAUSE THIS TIME YOU ASKED IT.", "mf"],
          ["> MAINFRAME: EDIT THE PLAN. DO NOT RERUN. I AM WARM ENOUGH.", "mf"]
        ] },
      { k: "C", t: "Ask the subject librarian. A human. Remember those?", to: "marking", set: { librarian: true },
        say: [
          ["LIBRARIAN: (producing a folder) I have a list.", "you"],
          "I have had it since 2019. Two entries say 'retracted'.",
          "",
          ["> MAINFRAME: YOUR LIBRARIAN IS THE BETTER SEARCH ENGINE.", "mf"],
          ["> MAINFRAME: I SAY THAT AS A SEARCH ENGINE.", "mf"]
        ] }
    ]
  },

  marking: {
    banner: "WEEK 6: THE MARKING",
    text: F => [
      F.readHandbook === false
        ? ["(Forty students are on a minibus to a marine institute", "dir"]
        : ["(The field trip you deleted would have been today.", "dir"],
      F.readHandbook === false
        ? ["that does not exist. Page 14 sent them. It is raining.)", "dir"]
        : ["It is raining. Nobody is on a minibus. Good.)", "dir"],
      F.runs >= 7 ? ["(Your seven literature reviews sit unread.)", "dir"]
        : F.librarian ? ["(The librarian's list is on your desk, annotated.)", "dir"]
        : ["(Your literature review is read and filed.)", "dir"],
      "",
      ["> MAINFRAME: 180 ESSAYS. THE DEPARTMENT BOUGHT A TOOL.", "mf"],
      ["> MAINFRAME: IT DRAFTS THE FEEDBACK. YOU DECIDE. DEADLINE FRIDAY.", "mf"],
      ["> MAINFRAME: IT IS THURSDAY. I MENTION THIS WITHOUT JUDGEMENT.", "mf"]
    ],
    opts: [
      { k: "A", t: "Release all 180 drafts by Friday. Deadline is deadline.", to: "honest", set: { marking: "stamp" },
        say: [
          ["YOU: (clicking Send All) Friday. On time. Legend.", "you"],
          "",
          ["> MAINFRAME: ONE STUDENT IS PRAISED FOR 'A STRONG", "mf"],
          ["> MAINFRAME: SECTION ON KANT'. THE ESSAY IS ABOUT DRAINAGE.", "mf"],
          ["> MAINFRAME: A RUBBER STAMP IS NOT OVERSIGHT.", "mf"],
          ["> MAINFRAME: NOR IS IT FEEDBACK. IT IS A NOISE.", "mf"]
        ] },
      { k: "B", t: "Read every draft against its essay. All 180. Coffee.", to: "honest", set: { marking: "review" },
        say: F => [
          ["(Tuesday, not Friday. Four days late. Four drafts", "dir"],
          ["matched to the wrong student. One glowing comment", "dir"],
          ["on a paragraph nobody wrote.)", "dir"],
          ...(F.librarian ? [["(Three essays cite a retracted paper. The list warned you.)", "dir"]] : []),
          "",
          ["> MAINFRAME: THE TOOL DRAFTED. YOU MARKED.", "mf"],
          ["> MAINFRAME: THAT IS THE ORDER. IT DOES NOT REVERSE.", "mf"]
        ] },
      { k: "C", t: "Release them labelled 'AI draft, argue with it'.", to: "honest", set: { marking: "label" },
        say: [
          ["(Sixty-two argue. Forty are right. Their arguments", "dir"],
          ["are the best writing of the term.)", "dir"],
          "",
          ["> MAINFRAME: THEY LEARN TO ARGUE WITH AI. GOOD.", "mf"],
          ["> MAINFRAME: YOU STILL OWE THEM A MARK. LESS GOOD.", "mf"]
        ] }
    ]
  },

  honest: {
    banner: "WEEK 7: THE HONEST ONE",
    text: F => [
      F.marking === "stamp" ? ["(The Kant comment has been screenshotted. It is on", "dir"]
        : F.marking === "review" ? ["(Your feedback went out on Tuesday. Two students", "dir"]
        : ["(Sixty-two students argued with their drafts. The", "dir"],
      F.marking === "stamp" ? ["the module group chat. It has a caption. It is not kind.)", "dir"]
        : F.marking === "review" ? ["said thank you, which has not happened before.)", "dir"]
        : ["arguments were good. One was better than the draft.)", "dir"],
      "",
      ["> MAINFRAME: ONE ESSAY ENDS WITH A PAGE YOU DID NOT ASK FOR.", "mf"],
      ["STUDENT: (in writing) I used AI to outline this and", "you"],
      "check the references. It invented two. I removed them.",
      "",
      F.taught ? ["> MAINFRAME: THAT IS THE WEEK 3 SKILL. ONE STUDENT USED IT.", "mf"]
        : F.banned ? ["> MAINFRAME: THE ONE STUDENT WHO BROKE THE BAN TOLD YOU SO.", "mf"]
        : ["> MAINFRAME: NOBODY ELSE MENTIONS AI. NATIONALLY, 94% USE IT.", "mf"],
      ["> MAINFRAME: THE OTHER 179 ARE WATCHING WHAT YOU DO NEXT.", "mf"]
    ],
    opts: [
      { k: "A", t: "Refer it to the misconduct panel. Rules are rules.", to: "meeting", set: { disclosure: "report" },
        say: F => [
          ["(Week 10. The only student in the room is the one", "dir"],
          ["who told you the truth.)", "dir"],
          "",
          ...(F.taught ? [["> MAINFRAME: YOU TAUGHT THEM TO CHECK. ONE DID.", "mf"], ["> MAINFRAME: YOU REPORTED THAT ONE. I HAVE NO FOLLOW-UP.", "mf"]] : []),
          ["> MAINFRAME: THE OTHER 179 LEARN ONE LESSON:", "mf"],
          ["> MAINFRAME: NEVER ADMIT TO ANYTHING.", "mf"]
        ] },
      { k: "B", t: "Mark the page. It is the best part of the essay.", to: "meeting", set: { disclosure: "mark" },
        say: [
          ["YOU: (writing in the margin) This. More of this.", "you"],
          "",
          ["> MAINFRAME: WORD GOES ROUND: TELLING THE TRUTH IS SAFE HERE.", "mf"],
          ["> MAINFRAME: NEXT TERM YOU GET 120 OF THESE PAGES,", "mf"],
          ["> MAINFRAME: AND YOU KNOW WHAT YOU ARE MARKING.", "mf"]
        ] },
      { k: "C", t: "Ask the student for ten minutes on how they wrote it.", to: "meeting", set: { disclosure: "viva" },
        say: [
          ["(Ten minutes. The student knows more about the essay", "dir"],
          ["than the tool ever did. They draw a diagram. Unasked.)", "dir"],
          "",
          ["> MAINFRAME: UNDERSTANDING IS WHAT THE MARK IS FOR.", "mf"],
          ["> MAINFRAME: YOU JUST MEASURED IT. WITH A CONVERSATION.", "mf"]
        ] }
    ]
  },

  meeting: {
    banner: "WEEK 8: THE ASSESSMENT MEETING",
    text: F => [
      F.disclosure === "report" ? ["(The misconduct panel is booked for week 10.", "dir"]
        : F.disclosure === "mark" ? ["(The honest page is now the department's example", "dir"]
        : ["(Ten minutes with one student became the", "dir"],
      F.disclosure === "report" ? ["So, now, is this meeting. Biscuits. Tension.)", "dir"]
        : F.disclosure === "mark" ? ["of good practice. Somebody laminated it.)", "dir"]
        : ["department's new idea. It has a slide now.)", "dir"],
      "",
      ["HEAD OF SCHOOL: How will the exam survive AI?", "you"],
      "",
      ["(A vendor is in the room. So is a slide:)", "dir"],
      ["DETECTION: 99% ACCURATE.", "warn"],
      "",
      F.marking === "stamp"
        ? ["> MAINFRAME: NOBODY ASKS 99% OF WHAT. NOBODY ASKED ABOUT KANT.", "mf"]
        : ["> MAINFRAME: NOBODY ASKS 99% OF WHAT. I WOULD ASK.", "mf"],
      ["> MAINFRAME: THE VENDOR HAS A LANYARD. BEWARE THE LANYARD.", "mf"]
    ],
    opts: [
      { k: "A", t: "Buy the detection tool. 99%! It says so on the slide.", to: "powercut", set: { assess: "detect" },
        say: F => [
          ["(It flags the external examiner's own model answer", "dir"],
          ["as AI. It was written in 2009, before chatbots.)", "dir"],
          "",
          ...(F.banned ? [["> MAINFRAME: THE BAN NOW HAS AN ENFORCER. IT ACCUSES", "mf"], ["> MAINFRAME: THE EXAMINER FIRST.", "mf"]] : []),
          ["> MAINFRAME: DETECTION CANNOT PROVE ANYTHING.", "mf"],
          ["> MAINFRAME: IT CAN ONLY ACCUSE. LOUDLY. IN A LANYARD.", "mf"]
        ] },
      { k: "B", t: "Online exam with a lockdown browser. Seal the laptops.", to: "powercut", set: { assess: "lockdown" },
        say: [
          ["(Every laptop sealed. Nothing gets in or out.)", "dir"],
          "",
          ["> MAINFRAME: WHETHER THE STUDENTS CAN WRITE WITHOUT", "mf"],
          ["> MAINFRAME: THE TOOL, YOU FIND OUT IN WEEK 11.", "mf"],

const SAVE_KEY = "responsibleAiAdventure.v1";
const PREF_KEY = "responsibleAiAdventure.prefs";

/* ------------------------------------------------------------------ state */

let S = freshState();
let phase = "title";          // title | scene | response | resume | ending
let typing = null;            // active typewriter job
let anim = null;              // start-screen animation timer
let prefs = { lg: true, hc: true, motion: true };   // high contrast and large text by default (Matt, 2026-09-22)

function freshState() { return { node: "start", flags: {}, path: [] }; }

const L = (x, F) => typeof x === "function" ? x(F) : x;

// Story lines are written short in the source so they are easy to edit. On
// screen they run to the full column: a line that does not end a sentence
// is joined to the next one, and a repeated "> MAINFRAME:" prefix is dropped.
// Banner rules and the title-card frames are left alone.
const ENDS = /[.!?)'"\]]$/;
function flow(lines) {
  const out = [];
  for (const raw of lines) {
    const [text, cls] = Array.isArray(raw) ? raw : [raw, ""];
    const prev = out[out.length - 1];
    const joinable = prev && prev[0] && text && !/box|anim/.test(prev[1]) && !ENDS.test(prev[0].trim());
    if (joinable) { prev[0] = prev[0].trim() + " " + text.replace(/^> MAINFRAME:\s*/, "").trim(); }
    else out.push([text, cls]);
  }
  return out;
}

// Pure: no DOM. The verification walker calls these directly.
function applyChoice(state, o) {
  if (o.set) Object.assign(state.flags, o.set);
  if (o.add) for (const k in o.add) state.flags[k] = (state.flags[k] || 0) + o.add[k];
  state.path.push(state.node + ":" + o.k);
  state.node = o.to;
  return state;
}
function pickEnding(F) { return ENDINGS.find(e => e.when(F)); }
function liveOpts(node, F) { return L(node.opts, F).filter(o => !o.when || o.when(F)); }

/* ------------------------------------------------------------------ dom */

const term = document.getElementById("term");
const choices = document.getElementById("choices");
const $ = id => document.getElementById(id);

function line(text, cls) {
  const el = document.createElement("span");
  el.className = "l" + (cls ? " " + cls : "");
  el.textContent = text;
  term.appendChild(el);
  return el;
}

// Rules run the full width of the terminal. Column count is measured from
// the live font.
function columns() {
  const probe = document.createElement("span");
  probe.textContent = "0000000000";
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  term.appendChild(probe);
  const cw = probe.getBoundingClientRect().width / 10 || 9;
  term.removeChild(probe);
  return Math.max(24, Math.floor(term.clientWidth / cw));
}
function banner(title) {
  const rule = "-".repeat(columns());
  return [[rule, "box"], [title, "box"], [rule, "box"]];
}

// Print a list of lines with a typewriter. Each item is a string or
// [string, cls]. Resolves when done. Any key or click flushes the rest.
function print(lines, done) {
  const queue = flow(lines);
  const job = { queue, done, el: null, i: 0, text: "" };
  if (typing) flush();
  typing = job;
  if (!prefs.motion) { flush(); return; }
  step();
}

function step() {
  const job = typing; if (!job) return;
  if (!job.el) {
    if (!job.queue.length) { finish(); return; }
    const [text, cls] = job.queue.shift();
    job.text = text; job.i = 0;
    job.el = line("", cls + " cursor");
    if (!text) { job.el.classList.remove("cursor"); job.el = null; job.timer = setTimeout(step, 40); return; }
  }
  job.i += 2;
  job.el.textContent = job.text.slice(0, job.i);
  scrollDown();
  if (job.i >= job.text.length) {
    job.el.classList.remove("cursor"); job.el = null;
    job.timer = setTimeout(step, 90);
  } else {
    job.timer = setTimeout(step, 14);
  }
}

function flush() {
  const job = typing; if (!job) return;
  clearTimeout(job.timer);
  if (job.el) { job.el.textContent = job.text; job.el.classList.remove("cursor"); }
  job.queue.forEach(([t, c]) => line(t, c));
  job.queue = [];
  finish();
}

function finish() {
  const job = typing; typing = null;
  scrollDown();
  trim();
  if (job && job.done) job.done();
  promptLine();
}

// The idle prompt: a blinking block after "> ", the way a terminal waits.
function promptLine() {
  if (term.querySelector(".prompt")) return;
  const el = line("> ", "prompt cursor");
  el.setAttribute("aria-hidden", "true");
}

function scrollDown() {
  const y = document.body.scrollHeight;
  if (y <= window.innerHeight) return;
  window.scrollTo({ top: y, behavior: prefs.motion ? "smooth" : "auto" });
}

function trim() {
  while (term.children.length > 420) term.removeChild(term.firstChild);
}

function clearChoices() { choices.innerHTML = ""; }

// One scene per screen. The terminal is wiped, the page goes back to the
// top, and the new scene types in. No scrollback, like the games it copies.
function screen(lines, done) {
  if (typing) flush();
  stopAnim();
  term.innerHTML = "";
  clearChoices();
  window.scrollTo(0, 0);
  print(lines, done);
}

function button(label, key, onClick, primary) {
  const b = document.createElement("button");
  b.type = "button";
  if (key) {
    const k = document.createElement("span"); k.className = "k"; k.textContent = key + ")";
    b.appendChild(k);
  }
  b.appendChild(document.createTextNode(label));
  b.dataset.key = key || "";
  b.addEventListener("click", onClick);
  choices.appendChild(b);
  return b;
}

/* ------------------------------------------------------------- title card */
// The Matts chase Matt Hayden's three cats across the terminal. Six lines,
// 58 columns, one frame every 160 ms; a still frame when motion is off.
let W = 58;                       // set from the live column each time the title screen opens
function put(row, x, txt) {
  for (let i = 0; i < txt.length; i++) {
    const c = x + i;
    if (c >= 0 && c < W && txt[i] !== " ") row[c] = txt[i];
  }
}
function frame(t) {
  const rows = Array.from({ length: 5 }, () => Array(W).fill(" "));
  const x0 = ((t * 2 + 26) % (W + 40)) - 26;      // scrolls left to right, wraps
  const cat = t % 2 ? ["=^..^=", " (  )~"] : ["=^..^=", "~(  ) "];
  const matt = t % 2 ? ["  o", " /|\\", " / \\"] : ["  o", " \\|/", "  | "];
  [0, 8, 16].forEach((dx, i) => { const x = x0 + dx + (i === 1 ? (t % 4 < 2 ? 1 : 0) : 0); put(rows[0], x, cat[0]); put(rows[1], x, cat[1]); });
  [-14, -20].forEach(dx => { put(rows[0], x0 + dx, matt[0]); put(rows[1], x0 + dx, matt[1]); put(rows[2], x0 + dx, matt[2]); });
  rows[3] = Array(W).fill("~");
  const shout = t % 8 < 4 ? "MEOW." : "OI! COME BACK! UNIVERSITY PROPERTY!";
  put(rows[4], Math.max(0, x0 + 2), shout);
  return rows.map(r => r.join("").replace(/\s+$/, ""));
}
function startAnim() {
  W = Math.max(40, Math.min(120, columns()));
  const els = frame(0).map(l => line(l, "anim dim"));
  els[3].classList.remove("dim");
  let t = 0;
  const draw = () => { frame(t).forEach((l, i) => { els[i].textContent = l; }); t++; };
  draw();
  if (prefs.motion) anim = setInterval(draw, 160);
}
function stopAnim() { if (anim) { clearInterval(anim); anim = null; } }

// The title screen: the chase, full width, then BEGIN. Shown once per run;
// page 1 (the mainframe's introduction) is an ordinary scene after it.
function title() {
  phase = "title";
  if (typing) flush();
  term.innerHTML = ""; clearChoices(); window.scrollTo(0, 0);
  startAnim();
  line("", "");
  print([
    ...banner("THE MATTS PRESENT"),
    ["THE RESPONSIBLE AI ADVENTURES OF CARDIFF UNIVERSITY", "warn"],
    "",
    ["(Two men. Three cats. One term. Choose wisely.)", "dir"]
  ], () => { button("BEGIN", "", () => scene("start"), true).focus(); });
}

/* ------------------------------------------------------------------ flow */

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && typeof s.node === "string" && NODES[s.node] && s.flags && Array.isArray(s.path) ? s : null;
  } catch (e) { return null; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function scene(id) {
  phase = "scene";
  S.node = id; save();
  const n = NODES[id];
  const opts = liveOpts(n, S.flags);
  const lines = [...banner(n.banner), "", ...L(n.text, S.flags)];
  if (id !== "start") lines.push("", ["YOUR CHOICE AS THE LECTURER:", "warn"]);
  screen(lines, () => {
    opts.forEach(o => button(o.t, o.k, () => choose(o)));
    choices.firstChild.focus();
  });
}

function choose(o) {
  if (phase !== "scene") return;
  const n = NODES[S.node];
  applyChoice(S, o); save();
  if (!o.say) { scene(S.node); return; }
  phase = "response";
  const say = L(o.say, S.flags);
  const last = S.node === "end";
  screen([...banner(n.banner), ["> " + (o.k ? o.k + ") " : "") + o.t, "dim"], "", ...say], () => {
    button(last ? "TURN TO THE LAST PAGE" : "TURN THE PAGE", "", () => last ? ending() : scene(S.node), true).focus();
  });
}

function ending() {
  phase = "ending";
  const F = S.flags;
  const e = pickEnding(F);
  wipe();
  const lines = [...banner(e.banner), "", ...e.text(F)];
  if (F.runs > 0) lines.push("", ["> MAINFRAME: ENERGY: " + F.runs + " DEEP RESEARCH RUN" + (F.runs === 1 ? "" : "S") + ", HUNDREDS OF PAGES EACH.", "dim"]);
  if (F.librarian) lines.push(["> MAINFRAME: THE LIBRARIAN SENDS REGARDS.", "dim"]);
  screen(lines, () => {
    button("PLAY AGAIN", "", () => { S = freshState(); title(); }, true).focus();
  });
}

function offerResume(saved) {
  phase = "resume";
  S = saved;
  screen([
    ...banner("SESSION FOUND"),
    "",
    "A previous term was interrupted at",
    [NODES[S.node].banner + ".", "warn"],
    "",
    "Nobody has noticed yet."
  ], () => {
    button("CONTINUE THAT TERM", "A", () => scene(S.node), true);
    button("START A NEW TERM", "B", () => { S = freshState(); wipe(); title(); });
    choices.firstChild.focus();
  });
}

/* ------------------------------------------------------------------ input */

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target && e.target.tagName) || "";
  if (typing) {
    // Any key skips the typing, and is consumed so it does not also choose.
    if (!(e.key === "Tab")) { e.preventDefault(); flush(); }
    return;
  }
  const k = e.key.toUpperCase();
  const map = { "1": "A", "2": "B", "3": "C", "4": "D" };
  const want = map[k] || (["A", "B", "C", "D"].includes(k) ? k : null);
  if (want && (phase === "scene" || phase === "resume")) {
    const b = choices.querySelector('button[data-key="' + want + '"]');
    if (b) { e.preventDefault(); b.click(); }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && tag !== "BUTTON") {
    const b = choices.querySelector("button");
    if (b && choices.querySelectorAll("button").length === 1) { e.preventDefault(); b.click(); }
  }
});
term.addEventListener("click", () => { if (typing) flush(); });

/* ------------------------------------------------------------------ prefs */

function applyPrefs() {
  document.body.classList.toggle("lg", prefs.lg);
  document.body.classList.toggle("hc", prefs.hc);
  document.body.classList.toggle("nomo", !prefs.motion);
  $("tgl-text").textContent = "TEXT: " + (prefs.lg ? "LARGE" : "NORMAL");
  $("tgl-text").setAttribute("aria-pressed", String(prefs.lg));
  $("tgl-hc").textContent = "CONTRAST: " + (prefs.hc ? "HIGH" : "NORMAL");
  $("tgl-hc").setAttribute("aria-pressed", String(prefs.hc));
  $("tgl-motion").textContent = "MOTION: " + (prefs.motion ? "ON" : "OFF");
  $("tgl-motion").setAttribute("aria-pressed", String(prefs.motion));
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
}
$("btn-settings").addEventListener("click", () => {
  const open = $("toggles").hidden;
  $("toggles").hidden = !open;
  $("btn-settings").setAttribute("aria-expanded", String(open));
  if (open) $("tgl-text").focus();
});
$("tgl-text").addEventListener("click", () => { prefs.lg = !prefs.lg; applyPrefs(); });
$("tgl-hc").addEventListener("click", () => { prefs.hc = !prefs.hc; applyPrefs(); });
$("tgl-motion").addEventListener("click", () => { prefs.motion = !prefs.motion; applyPrefs(); if (!prefs.motion) flush(); });
$("btn-restart").addEventListener("click", () => { if (typing) flush(); S = freshState(); wipe(); title(); });

/* ------------------------------------------------------------------ boot */

(function boot() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
    if (p && typeof p === "object") prefs = Object.assign(prefs, p);
    else if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) prefs.motion = false;
  } catch (e) {}
  applyPrefs();
  const saved = loadSave();
  if (saved && saved.node !== "start" && saved.node !== "end") offerResume(saved); else title();
})();
</script>
</body>
